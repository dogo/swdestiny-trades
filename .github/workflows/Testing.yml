name: Testing
on: [push, pull_request]

env:
  TUIST_TOKEN: ${{ secrets.TUIST_CLOUD_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # Xcode compilation cache (CAS) is disabled on CI: the remote CAS served
  # corrupt artifacts (`downloadCASArtifact ... isn't in the correct format`).
  # Local dev keeps caching on. Note: the "Recursive expansion of macro
  # 'require'" build error once blamed on the CAS was actually the Xcode 26.2
  # toolchain failing to expand Swift Testing macros; fixed by bumping
  # .xcode-version to 26.6.
  TUIST_DISABLE_XCODE_CACHE: '1'

jobs:
  test:
    name: Testing SWDestiny Trades app
    runs-on: macos-26
    strategy:
      matrix:
        scheme: [
          SWDestinyTrades
        ]
        workspace: [
          swdestiny-trades.xcworkspace
        ]
        destination: [
          'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_$(cat .xcode-version).app

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: Tuist/.build
          key: ${{ runner.os }}-app-${{ hashFiles('Package.resolved') }}

      - name: Install Project Tools
        uses: jdx/mise-action@v4
        with:
          experimental: true

      # Note: the Xcode cache (CAS) is disabled CI-wide via
      # TUIST_DISABLE_XCODE_CACHE (env above), so there's no `tuist setup cache`
      # step here — the project is never wired to the remote CAS socket.

      - name: Install Tuist dependencies
        if: steps.cache-restore.outputs.cache-matched-key == ''
        run: tuist install

      - name: Generate project with tuist
        run: |
          tuist generate --no-open
        shell: bash

      - name: Toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Test ${{ matrix.scheme }} on ${{ matrix.destination }}
        run: |
          xcodebuild \
            -workspace "${{ matrix.workspace }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -resultBundlePath ./coverage/SwdUnitTests.xcresult \
            -enableCodeCoverage YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 | tee xcodebuild-raw.log | xcpretty && exit ${PIPESTATUS[0]}

      # xcpretty swallows compiler diagnostics' file/line details; keep the raw
      # xcodebuild output around for debugging build failures.
      - name: Upload raw xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-raw-log
          path: xcodebuild-raw.log

      # Convert the app-scoped .xcresult into Cobertura XML ourselves so Codecov
      # reports app coverage. Codecov's own xcresult auto-discovery picked up the
      # test bundle instead of the app target.
      - name: Convert coverage to Cobertura
        run: |
          brew install xcresultparser
          xcresultparser --output-format cobertura \
            --project-root "$PWD" \
            ./coverage/SwdUnitTests.xcresult > ./coverage/cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/cobertura.xml
          disable_search: true
          # Disable the built-in xcode plugin: its `llvm-cov` pass fails on the
          # app binary and only produces the xctest bundle's coverage, which
          # would otherwise be uploaded alongside (and contaminate) our report.
          plugins: noop
          verbose: true

      - name: Upload Snapshot Failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: SWDestinyTradesTests/FailureDiffs/

      - name: Save cache
        id: cache-save
        uses: actions/cache/save@v6
        with:
          path: Tuist/.build
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
